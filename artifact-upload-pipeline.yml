trigger:
- main

variables:
  major: 1
  minor: 0
  patch: $[counter(format('{0}.{1}', variables.major, variables.minor), 1)]

pool:
  vmImage: ubuntu-24.04

steps:
- task: UseDotNet@2
  inputs:
    version: 10.0.x

- script: echo Version $(major).$(minor).$(patch)

- script: dotnet publish HelloWorld -o $(Build.ArtifactStagingDirectory)

- task: UniversalPackages@0
  inputs:
    command: publish
    vstsFeedPublish: Azure-Hello-World/hello-world
    vstsFeedPackagePublish: helloworld
    versionOption: custom
    versionPublish: $(major).$(minor).$(patch)
