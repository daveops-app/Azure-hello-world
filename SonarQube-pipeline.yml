trigger:
- feature

pr: none

pool:
  vmImage: ubuntu-24.04

steps:
- checkout: self
  fetchDepth: 0

- task: UseDotNet@2
  inputs:
    version: 10.0.x

- task: SonarCloudPrepare@4
  inputs:
    SonarCloud: sonarcloud
    organization: daveops-app
    scannerMode: dotnet
    projectKey: daveops-app_Azure-hello-world

- script: dotnet build HelloWorld

- task: SonarCloudAnalyze@4
  inputs:
    jdkversion: JAVA_HOME_21_X64 # docs recommend setting java 21, java 17 support was removed

- task: SonarCloudPublish@4
  inputs:
    pollingTimeoutSec: 300
