trigger:
- feature

pr: none # the pipeline runs only on push to feature, not on pull request

variables:
  major: 1
  minor: 0
  patch: $[counter(format('{0}.{1}', variables.major, variables.minor), 1)]
  version: $(major).$(minor).$(patch)-$(Build.SourceBranchName)

pool:
  vmImage: ubuntu-24.04

steps:
- checkout: self
  fetchDepth: 0

- task: UseDotNet@2
  inputs:
    version: 10.0.x

- task: SonarCloudPrepare@4
  inputs:
    SonarCloud: sonarcloud
    organization: daveops-app
    scannerMode: dotnet
    projectKey: daveops-app_Azure-hello-world
    extraProperties: |
      sonar.qualitygate.wait=true

# build the dll in release mode with the version, e.g. 1.0.1-feature
- script: dotnet build HelloWorld -c Release -p:Version=$(version)

# run the unit tests, the test result shows in the pipeline Tests tab
- task: DotNetCoreCLI@2
  inputs:
    command: test
    projects: HelloWorld.Tests

- task: SonarCloudAnalyze@4
  inputs:
    jdkversion: JAVA_HOME_21_X64 # docs recommend setting java 21, java 17 support was removed

- task: SonarCloudPublish@4
  inputs:
    pollingTimeoutSec: 300

# pack the already built dll (no rebuild) into a nuget package in the staging folder
- script: dotnet pack HelloWorld -c Release --no-build -p:Version=$(version) -o $(Build.ArtifactStagingDirectory)
  condition: succeeded()

- task: DotNetCoreCLI@2
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'feature'))
  inputs:
    command: push
    packagesToPush: $(Build.ArtifactStagingDirectory)/*.nupkg
    nuGetFeedType: internal
    publishVstsFeed: Azure-Hello-World/hello-world

# send an email with the pipeline status, runs even if a step failed
- script: |
    echo "Subject: $(Agent.JobStatus) $(version)" | curl smtps://smtp.gmail.com:465 -u "$(EMAIL):$(SMTP_PASSWORD)" --mail-from "$(EMAIL)" --mail-rcpt "$(EMAIL)" -T -
  condition: always()
